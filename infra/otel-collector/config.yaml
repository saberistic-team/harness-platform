# Local OpenTelemetry collector for the harness (ROADMAP M2).
#
# The kernel/CLI/evals bridge (packages/otel) speaks OTLP/HTTP; this
# collector is the "local collector" of the dev loop: point the
# harness at it with
#
#   OTEL_EXPORT_OTLP_ENDPOINT=http://127.0.0.1:4318 pnpm evals
#   OTEL_EXPORT_OTLP_ENDPOINT=http://127.0.0.1:4318 pnpm harness run tasks/foo.yaml
#
# Spans are printed (debug exporter) so a laptop with no Grafana stack
# still sees the full harness trace. Swap the exporter for `otlphttp`
# / `prometheus` to feed a real backend.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    verbosity: basic

  logging:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [logging]
