apiVersion: v1
kind: Secret
metadata:
  name: harness-agent-server-secrets
  namespace: harness
  annotations:
    harness.dev/example-only: "true"
    harness.dev/replace-before-apply: "all REPLACE_* values"
type: Opaque
stringData:
  HARNESS_DATABASE_URL: REPLACE_AGENT_SESSION_POSTGRES_URL_WITH_EXPLICIT_SSLMODE
  HARNESS_AGENT_TOKEN: REPLACE_AGENT_BEARER_TOKEN
  OPENAI_API_KEY: REPLACE_OPTIONAL_PROVIDER_KEY
