  name: harness-minio-bootstrap
  namespace: harness
  annotations:
    harness.dev/example-only: "true"
    harness.dev/replace-before-apply: "all REPLACE_* values"
type: Opaque
stringData:
  MINIO_ROOT_USER: REPLACE_MINIO_ROOT_USER
  MINIO_ROOT_PASSWORD: REPLACE_MINIO_ROOT_PASSWORD
