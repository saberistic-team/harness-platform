apiVersion: v1
kind: Secret
metadata:
  name: harness-control-plane-secrets
  namespace: harness
  annotations:
    harness.dev/example-only: "true"
    harness.dev/replace-before-apply: "all REPLACE_* values"
type: Opaque
stringData:
  HARNESS_DATABASE_URL: REPLACE_CONTROL_PLANE_POSTGRES_URL_WITH_EXPLICIT_SSLMODE
  HARNESS_ARTIFACT_ACCESS_KEY: REPLACE_ARTIFACT_ACCESS_KEY
  HARNESS_ARTIFACT_SECRET_KEY: REPLACE_ARTIFACT_SECRET_KEY
  HARNESS_CONTROL_PLANE_TOKEN: REPLACE_CONTROL_PLANE_BEARER_TOKEN
