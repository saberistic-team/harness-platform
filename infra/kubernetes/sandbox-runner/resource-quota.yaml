apiVersion: v1
kind: ResourceQuota
metadata:
  name: harness-sandboxes
  namespace: harness-sandboxes
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 32Gi
    requests.ephemeral-storage: 8Gi
    limits.cpu: "32"
    limits.memory: 64Gi
    limits.ephemeral-storage: 16Gi
    pods: "50"
    count/jobs.batch: "100"
