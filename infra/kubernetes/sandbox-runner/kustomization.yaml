apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - default-deny.yaml
  - resource-quota.yaml
  - limit-range.yaml
  - serviceaccount.yaml

configMapGenerator:
  - name: harness-sandbox-job-template
    namespace: harness
    files:
      - job-template.yaml

generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: sandbox-runner
    app.kubernetes.io/component: execution
    app.kubernetes.io/part-of: harness
  annotations:
    harness.dev/template-only: "deployment contract only; Kustomize does not create the Job and the current runtime does not consume this ConfigMap"
