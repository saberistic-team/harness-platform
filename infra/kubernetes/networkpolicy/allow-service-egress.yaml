apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-control-plane-service-egress
  namespace: harness
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: control-plane
      app.kubernetes.io/part-of: harness
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
              app.kubernetes.io/part-of: harness
      ports:
        - { port: 5432, protocol: TCP }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: minio
              app.kubernetes.io/part-of: harness
      ports:
        - { port: 9000, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agent-server-service-egress
  namespace: harness
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-server
      app.kubernetes.io/part-of: harness
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
              app.kubernetes.io/part-of: harness
      ports:
        - { port: 5432, protocol: TCP }
