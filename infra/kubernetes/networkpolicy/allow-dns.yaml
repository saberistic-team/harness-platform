apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: harness
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: harness
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - control-plane
          - agent-server
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
