apiVersion: v1
kind: Service
metadata:
  name: harness-control-plane
  namespace: harness
  labels:
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/component: scheduler
    app.kubernetes.io/part-of: harness
spec:
  selector:
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/part-of: harness
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
