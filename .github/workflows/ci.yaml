# The required gate on every PR (ROADMAP M1): the three commands that
# constitute dogfooding — the platform testing itself.
#
#   pnpm test
#   pnpm typecheck
#   harness run tasks/<id>.yaml (pull requests only)
#
# Mark this workflow's `gate` job as REQUIRED (branch protection) so
# no PR merges without it. CI also provides the delivery link
# (deliverables.pullRequest in the run report) via
# HARNESS_PULL_REQUEST_URL — the CLI records it verbatim, it never
# fabricates a URL.

name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: exit gate — test + typecheck + harness run
    runs-on: ubuntu-latest
    env:
      # On pull_request events this is the real PR URL; on push it
      # stays empty and the report records the delivery branch.
      HARNESS_PULL_REQUEST_URL: ${{
        (github.event_name == 'pull_request'
        && format('https://github.com/{0}/pull/{1}', github.repository, github.event.pull_request.number))
        || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The exit gate compares every committed task change with the PR
          # base, so it needs complete history and the exact advertised head.
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm (pinned)
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile — supply-chain gate)
        run: pnpm install --frozen-lockfile

      - name: Typecheck (strict across the workspace)
        run: pnpm typecheck

      - name: Test (offline by design)
        run: pnpm test

      - name: Golden-kernel scenarios (evals run the kernel)
        run: pnpm evals

      - name: Exit gate — manifest matching the task branch
        # Run even when an earlier quality check fails: the harness owns the
        # structured test/preflight report and the final upload is evidence.
        if: always() && github.event_name == 'pull_request'
        env:
          TASK_HEAD_REF: ${{ github.head_ref }}
          TASK_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TASK_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Keep invalid branch names inside the harness failure path too. For
          # example, feature/x maps to a missing/non-canonical nested manifest;
          # a one-segment branch with a manifest reaches the exact-branch gate.
          # Either way the CLI emits a structured preflight report before it
          # returns failure, instead of this shell step exiting first.
          task_id="${TASK_HEAD_REF#tasks/}"
          manifest="tasks/${task_id}.yaml"
          pnpm harness run "$manifest" \
            --ci-head-ref "$TASK_HEAD_REF" \
            --head-sha "$TASK_HEAD_SHA" \
            --base-ref "$TASK_BASE_SHA"
        # CI provides the PR URL via HARNESS_PULL_REQUEST_URL above;
        # it lands in deliverables.pullRequest of the report.

      - name: Evidence — upload run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-evidence-${{ github.run_id }}
          path: tasks/runs/
          if-no-files-found: ignore
